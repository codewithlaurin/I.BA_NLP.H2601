# 2 batches x 3 rates x 3 decays x 3 dropouts x 3 head widths = 162 runs at seed 42.
name: P1-GRU-Batch-LR-Decay-Dropout-Width
description: Tune batch size, learning rate, AdamW decay, recurrent dropout, and classifier width at seed 42.
program: train_rnn.py
entity: laurin-uni-workspace
project: nlp-classifier
method: grid
run_cap: 162

metric:
  name: best_validation_loss
  goal: minimize

parameters:
  batch-size:
    values: [64, 256]
  learning-rate:
    values: [0.001, 0.003, 0.006]
  weight-decay:
    values: [0.0, 0.0001, 0.001]
  seed:
    value: 42
  rnn-type:
    value: gru
  rnn-hidden-size:
    value: 256
  rnn-dropout:
    values: [0.2, 0.4, 0.6]
  hidden-dim:
    values: [128, 256, 512]
  dropout:
    value: 0.2
  gradient-clip-norm:
    value: 1.0
  epochs:
    value: 60
  patience:
    value: 8
  min-delta:
    value: 0.0

command:
  - ${env}
  - uv
  - run
  - python
  - ${program}
  - ${args}
  - --inputs-path
  - outputs/experiments/20261025-134703-ebc0827b/inputs.pt
  - --device
  - mps
  - --output-dir
  - outputs/overnight-gru
  - --wandb-project
  - nlp-classifier
  - --wandb-entity
  - laurin-uni-workspace
  - --wandb-group
  - P1-GRU-Batch-LR-Decay-Dropout-Width
  - --wandb-mode
  - online
  - --wandb-name
  - GRU-rh{rnn_hidden_size}-head{hidden_dim}-b{batch_size}-lr{learning_rate}-rd{rnn_dropout}-d{dropout}-wd{weight_decay}-s{seed}
