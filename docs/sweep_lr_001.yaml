# Two explicit model families at seed 42 = two fresh runs.
name: P1-LearningRate-0.01
description: Test learning rate 0.01 around the accuracy-winning mean-pooling and GRU configurations.
program: train_learning_rate_sweep.py
entity: laurin-uni-workspace
project: nlp-classifier
method: grid
run_cap: 2

metric:
  name: peak_validation_accuracy
  goal: maximize

parameters:
  model_family:
    values: [mean_pool, rnn]
  learning-rate:
    value: 0.01
  seed:
    value: 42

command:
  - ${env}
  - uv
  - run
  - python
  - ${program}
  - ${args}
  - --device
  - mps
  - --wandb-group
  - P1-LearningRate-0.01
  - --wandb-mode
  - online
