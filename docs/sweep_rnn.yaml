# Initial screening: 2 cell types x 2 hidden sizes x 3 learning rates = 12 runs.
# Run from the project root; the saved inputs are a local, ignored artifact.
name: P1-RNN-ArchitectureLearningRate
description: Compare recurrent cell type, width, and learning rate at seed 42.
program: train_rnn.py
entity: laurin-uni-workspace
project: nlp-classifier
method: grid

metric:
  name: best_validation_loss
  goal: minimize

# Hyphenated keys match argparse flags expanded by ${args}.
parameters:
  rnn-type:
    values: [gru, lstm]
  rnn-hidden-size:
    values: [128, 256]
  learning-rate:
    values: [0.0003, 0.001, 0.003]
  rnn-dropout:
    value: 0.0
  hidden-dim:
    value: 256
  dropout:
    value: 0.2
  weight-decay:
    value: 0.0001
  batch-size:
    value: 64
  epochs:
    value: 30
  patience:
    value: 5
  min-delta:
    value: 0.0
  gradient-clip-norm:
    value: 1.0
  seed:
    value: 42
  device:
    value: auto

# One process and one scalar learning rate per sweep trial.
# Keep P1-RNN so runs also appear in the existing saved comparison view.
command:
  - ${env}
  - uv
  - run
  - python
  - ${program}
  - ${args}
  - --inputs-path
  - outputs/experiments/20261025-134703-ebc0827b/inputs.pt
  - --wandb-project
  - nlp-classifier
  - --wandb-entity
  - laurin-uni-workspace
  - --wandb-group
  - P1-RNN
  - --wandb-mode
  - online
  - --wandb-name
  - RNN-E1-{rnn_type}-h{rnn_hidden_size}-lr{learning_rate}-seed{seed}
